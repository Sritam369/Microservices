spring.application.name=Gateway-API-Proj

server.port=9094

eureka.client.service-url.default-zone=http://localhost:8761/eureka

management.endpoints.web.exposure.include=*

spring.cloud.gateway.server.webflux.routes[0].id=Product-Service-Proj
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:9090/
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/product/**

spring.cloud.gateway.server.webflux.routes[1].id=Order-Service-Proj
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:9091/
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/order/**

spring.cloud.gateway.server.webflux.routes[2].id=Payment-Service-Proj
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:9092/
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/payment/**

spring.cloud.gateway.server.webflux.routes[3].id=Notification-Service-Proj
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:9093/
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/notification/**